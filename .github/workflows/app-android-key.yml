# Run once: makes the Android upload key, encrypts it with your ANDROID_KEY_PASSWORD secret,
# and saves it to app/keys/android-upload.jks.enc in this repository. See app/README.md.
name: App · Android upload key (run once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the password secret
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "::error::Add the ANDROID_KEY_PASSWORD secret first (Settings → Secrets and variables → Actions)."; exit 1; fi
          if [ ${#PW} -lt 12 ]; then echo "::error::ANDROID_KEY_PASSWORD should be at least 12 characters."; exit 1; fi
          if [ -f app/keys/android-upload.jks.enc ]; then echo "::error::An upload key already exists. Delete app/keys/android-upload.jks.enc only if you mean to replace it (Google Play would then need to be told)."; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make and encrypt the key
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -keystore upload.jks -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Jacob Cooper, O=The Way, C=US"
          mkdir -p app/keys
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -in upload.jks -out app/keys/android-upload.jks.enc -pass env:PW
          rm -f upload.jks
          keytool -list -v -keystore <(openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in app/keys/android-upload.jks.enc -pass env:PW) -storepass "$PW" 2>/dev/null | grep -E "SHA256|Valid" || true
      - name: Save it to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/keys/android-upload.jks.enc
          git commit -m "Add the encrypted Android upload key"
          git push
