# Compresses recordings after every push that adds or changes audio: each MP3 above the target bitrate is re-encoded as
# mono MP3 at that bitrate (same name and format, so the game needs no change) and committed back.
# To change the quality, edit KBPS below (56 or 64 sound a little fuller; 48 is about 70% smaller than the originals).
name: Compress audio
on:
  push:
    paths:
      - 'audio/**/*.mp3'
  workflow_dispatch:
env:
  KBPS: 48
permissions:
  contents: write
concurrency:
  group: compress-audio
  cancel-in-progress: false
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compress recordings above ${{ env.KBPS }} kbps
        run: bash tools/compress-audio.sh "$KBPS" audio
      - name: Commit the smaller files
        run: |
          if [ -n "$(git status --porcelain audio)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add audio
            git commit -m "Compress audio to ${KBPS} kbps mono"
            git push
          else
            echo "No recordings needed compressing."
          fi
